name: All Green v2

on: # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ["*"]
    types: [in_progress, completed]
  status:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to evaluate
        required: true
      fault:
        description: Sandbox fault injection
        type: choice
        default: none
        options: [none, crash, hang, kill]

concurrency:
  group: ${{ github.workflow }}-${{ inputs.sha || github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  statuses: write
  actions: read

env:
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.event.sha }}
  CONTEXT: all-jobs-are-green-v2
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  evaluate:
    if: github.event.workflow_run.name != github.workflow && github.event.context != 'all-jobs-are-green-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mark pending
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.action == 'in_progress' ||
          (github.event.action == 'completed' && !contains(fromJSON('["success","skipped","neutral"]'), github.event.workflow_run.conclusion)) ||
          (github.event_name == 'status' && github.event.state != 'success')
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=pending
          -f context="$CONTEXT"
          -f description="Evaluating"
          -f target_url="$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Inject fault
        if: inputs.fault && inputs.fault != 'none'
        timeout-minutes: 1
        run: |
          case "$FAULT" in
            crash) exit 1 ;;
            hang) sleep 600 ;;
            kill) sudo pkill -9 -f '[R]unner\.(Listener|Worker)'; sleep 600 ;;
          esac
        env:
          FAULT: ${{ inputs.fault }}
      - name: Evaluate
        run: ruby .github/scripts/all_green.rb "$SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_SUITE_ID: ${{ github.event.action == 'completed' && github.event.workflow_run.check_suite_id || '' }}
          TRIGGER_STATUS_ID: ${{ github.event.id }}
          TRIGGER_CONTEXT: ${{ github.event.context }}
          IGNORED: |
            devflow/mergegate
            all-jobs-are-green
            Check Pull Request CI Status
            All Green v3
            all-jobs-are-green-v3

  report:
    needs: evaluate
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report failure
        run: |
          for delay in 10 20 40 80 0; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=error \
              -f context="$CONTEXT" \
              -f description="Evaluation failed, re-run" \
              -f target_url="$RUN_URL" && exit 0
            sleep "$delay"
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
