name: CodeQL

on: # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    env:
      JOB: codeql
      MIN: 120
      MAX: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .sandbox
      - run: .sandbox/job.sh

  complete:
    name: CodeQL (complete)
    needs: analyze
    runs-on: ubuntu-24.04
    steps:
      - run: echo ok
