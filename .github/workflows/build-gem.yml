name: Build Gem

on: # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build gem (${{ matrix.type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [final, dev]
    env:
      JOB: build-gem/${{ matrix.type }}
      MIN: 30
      MAX: 60
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .sandbox
      - run: .sandbox/job.sh

  test:
    name: Test gem
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [final, dev]
    env:
      JOB: test-gem/${{ matrix.type }}
      MIN: 30
      MAX: 60
    steps: *steps

  complete:
    name: Build Gem (complete)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - run: echo ok
